[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loadx-quant"
version = "0.1.0"
description = "QuantPad-style backtesting and prop-firm Monte Carlo testing on QuantConnect Cloud"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LoadX" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13",
    "PyYAML>=6",
    "plotly>=5.20",
    "jinja2>=3.1",
    "requests>=2.31",
]

[project.optional-dependencies]
qc = ["lean>=1.0"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
quant = "quantlab.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108", "B008"]  # ternary preference; typer uses function-call defaults

[tool.mypy]
python_version = "3.11"
strict = false
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
files = ["src/quantlab"]
[[tool.mypy.overrides]]
module = ["plotly.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running tests (still run in CI)"]

[tool.coverage.run]
source = ["src/quantlab"]
