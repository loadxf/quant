# Column mapping for examples/trades_sample.csv
# Auto-detection finds the same columns, but NOT the timezone: the sample's
# naive Chicago wall times would be read as UTC (the ingest says so when it
# happens). Pass this mapping — or at least `--map tz=America/Chicago` — for
# correct session grouping.
entry_time: "Entry DateTime"
exit_time: "Exit DateTime"
symbol: "Symbol"
side:
  column: "Type"
  long_values: ["buy", "long", "b"]
  short_values: ["sell", "short", "s"]
quantity: "Qty"
pnl: "Net P/L"
fees: "Fees"
mae: "MAE"
mfe: "MFE"
tz: "America/Chicago"
