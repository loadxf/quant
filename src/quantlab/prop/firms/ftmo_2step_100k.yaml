# FTMO Challenge 2-Step, $100K (classic product)
# Verified 2026-07-19 against ftmo.com/en/trading-objectives,
# ftmo.com/en/comparison-table, academy.ftmo.com (maximum-daily-loss,
# maximum-loss), ftmo.com/en/faq. All objectives are % of initial capital
# and scale linearly across sizes — clone this file for other sizes.
# - Max Daily Loss 5% of initial ($5,000): the line re-anchors EVERY
#   midnight CE(S)T to the prior-day BALANCE (it can move down); breached
#   on intraday EQUITY (open P&L + closed P&L + fees), strictly below.
# - Max Loss 10% of initial ($10,000): STATIC equity floor, all phases.
# - Min 4 trading days per phase; NO time limit (removed 2023-07-13).
# - Fee ~EUR 540 (secondary-sourced per-size price), 100% REFUNDED with
#   the first funded reward. Split 80/20 -> 90/10 via Scaling Plan.
name: ftmo_2step_100k
display_name: "FTMO 2-Step 100K"
firm: FTMO
account_size: 100000
day_boundary: {tz: Europe/Prague, cutoff_hour: 0}
verified_as_of: "2026-07-19"
sources:
  - https://ftmo.com/en/trading-objectives/
  - https://ftmo.com/en/comparison-table/
  - https://academy.ftmo.com/lesson/maximum-daily-loss/
  - https://academy.ftmo.com/lesson/maximum-loss/
phases:
  - name: challenge
    profit_target: 10000
    rules:
      - {type: static_max_loss, pct: 10, inclusive: false}
      - {type: daily_loss_limit, pct: 5, anchor: prev_midnight_balance, effect: fail, inclusive: false}
      - {type: min_trading_days, days: 4}
  - name: verification
    profit_target: 5000
    rules:
      - {type: static_max_loss, pct: 10, inclusive: false}
      - {type: daily_loss_limit, pct: 5, anchor: prev_midnight_balance, effect: fail, inclusive: false}
      - {type: min_trading_days, days: 4}
funded:
  name: funded
  rules:
    - {type: static_max_loss, pct: 10, inclusive: false}
    - {type: daily_loss_limit, pct: 5, anchor: prev_midnight_balance, effect: fail, inclusive: false}
fees:
  one_time: 540
  refundable_on_first_payout: true
payout:
  profit_split: 0.8
  period_days: 14
notes: |
  Scaling Plan (90% split, +25% capital every 4 months with >=10% profit,
  >=2 rewards, positive balance) is not modeled. US access runs via
  ftmo.oanda.com since Aug 2025.
