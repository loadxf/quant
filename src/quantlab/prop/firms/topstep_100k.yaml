# Topstep 100K Trading Combine + Express Funded Account (XFA)
# Verified 2026-07-19 against help.topstep.com (articles 8284204, 10490293,
# 8284197, 8284208, 8284215, 8284233, 14289835, 8284128) and topstep.com;
# payout paths, MLL reset event, session close, and fees re-verified
# 2026-08-13 (articles 8284208, 8284213, 8284215, 8284233).
# - MLL: trails END-OF-DAY balance highs only, enforced in REAL TIME incl.
#   unrealized P&L, locks permanently at the starting balance. After each
#   payout approval it "resets to $0 permanently" — modeled as an explicit
#   event (payout.mll_reset_on_payout).
# - No Daily Loss Limit by default on TopstepX since Aug 2024 (optional
#   lockout-only setting; add a daily_loss_limit rule with effect: lockout
#   if you opt in at purchase).
# - All positions must be flat by 15:10 America/Chicago (session_close).
# - Combine consistency: best day <= 50% of the PROFIT TARGET; exceeding it
#   raises the required total to best_day / 0.50 (never a breach).
# - XFA: starts at $0 balance, MLL -3,000 locking at $0; $149
#   activation; 90/10 split (joiners on/after 2026-01-12). Payout paths:
#   * standard: 5 winning days of $150+, positive profit since the prior
#     payout (first exempt), up to 50% of balance, cap $3,000/payout.
#   * consistency: >= 3 active days, best day <= 40% of window total
#     (inclusive), cap $4,000/payout; window resets after each payout.
#   Both: min payout $125. Back2Funded: up to 2 paid reactivations.
# - No time limit; monthly fee $99 (reset = monthly price; 1 free
#   reset credit banked per monthly rebill). Prices are promotional/volatile.
name: topstep_100k
display_name: "Topstep 100K Combine"
firm: Topstep
account_size: 100000
day_boundary: {tz: America/Chicago, cutoff_hour: 17}
fee_profile: topstepx_2026_08_13
verified_as_of: "2026-08-13"
sources:
  - https://help.topstep.com/en/articles/8284204
  - https://help.topstep.com/en/articles/10490293
  - https://help.topstep.com/en/articles/8284208
  - https://help.topstep.com/en/articles/8284213
  - https://help.topstep.com/en/articles/8284215
  - https://help.topstep.com/en/articles/8284233
phases:
  - name: challenge
    profit_target: 6000
    rules:
      - {type: trailing_drawdown, amount: 3000, ratchet: eod, threshold_cap: 100000}
      - {type: consistency, max_best_day_pct: 50, basis: profit_target, effect: raise_target}
      - {type: session_close, tz: America/Chicago, hard_close: "15:10:00"}
funded:
  name: funded
  initial_balance: 0
  rules:
    - {type: trailing_drawdown, amount: 3000, ratchet: eod, threshold_cap: 0}
    - {type: session_close, tz: America/Chicago, hard_close: "15:10:00"}
    # XFA Scaling Plan (article 8284223): tier thresholds from convergent
    # secondaries capped at the 100K Combine max (10); official table is
    # an image - re-verify before relying at size.
    - type: scaling_plan
      tiers:
        - {min_balance: 0, max_contracts: 3}
        - {min_balance: 1500, max_contracts: 4}
        - {min_balance: 2000, max_contracts: 5}
        - {min_balance: 3000, max_contracts: 10}
    - {type: contract_limit, max_contracts: 10}
fees:
  monthly: 99
  reset: 99
  free_resets_per_cycle: 1
  activation: 149
payout:
  profit_split: 0.9
  min_payout: 125
  period_days: 0
  qualifying_days: {count: 5, min_daily_profit: 150}
  payout_cap_ladder: [3000]
  payout_share_of_balance: 0.5
  reactivations: {max: 2, fees: [699, 699]}
  path: standard
  require_profit_since_prior_payout: true
  mll_reset_on_payout: true
  consistency: {min_days: 3, max_best_day_pct: 40, payout_cap_ladder: [4000]}
notes: |
  Both XFA payout paths are modeled; the Standard path is the default
  (switch with payout.path: consistency or --payout-path). The purchase
  DLL (official fixed amount) and the June-2026 promotional doubled
  payout caps are available as labeled NON-BASELINE scenarios via
  `quant prop simulate --dll [--promo-caps]`; strategies must not depend
  on temporary promotions, and the no-DLL non-promotional configuration
  is the primary result. Live Funded Account call-up beyond the XFA is
  discretionary and out of scope.
